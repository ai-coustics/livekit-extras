[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coustics-livekit-extras"
version = "0.1.0"
description = "ai-coustics noise cancellation for LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ai-coustics GmbH", email = "info@ai-coustics.com" }]
keywords = ["ai-coustics", "audio", "livekit", "noise-cancellation", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "aic-sdk>=3.1.0,<4",
  "livekit-agents>=1.4.2,<2",
  "numpy>=2.0.2",
  "opentelemetry-api>=1.14,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.0",
  "pytest-asyncio>=0.25",
  "ruff>=0.12",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"livekit.plugins.ai_coustics" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a real SDK license and model download",
  "e2e: tests that require a running LiveKit server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["livekit.plugins.ai_coustics"]

[[tool.mypy.overrides]]
module = "aic_sdk"
disable_error_code = ["type-arg"]
