name: Release

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git branch --remotes --contains "$GITHUB_SHA" | grep --quiet 'origin/main'; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Check package versions against tag
        run: |
          python_version=$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          node_version=$(node -p "require('./node/package.json').version")

          if [ "$GITHUB_REF_NAME" != "$python_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Python package version $python_version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$node_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Node package version $node_version"
            exit 1
          fi

  build-python:
    name: Build Python distribution
    needs: check-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload Python distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  build-node:
    name: Build Node.js distribution
    needs: check-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Create package tarball
        run: npm pack

      - name: Upload Node.js distribution
        uses: actions/upload-artifact@v7
        with:
          name: node-dist
          path: node/*.tgz
          if-no-files-found: error

  publish-python:
    name: Publish Python package
    needs: [build-python, build-node]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      # Authenticates through PyPI trusted publishing (OIDC). No API token is
      # stored: PyPI verifies this repository, workflow file, and environment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-node:
    name: Publish Node.js package
    needs: [build-python, build-node]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm for OIDC support
        run: npm install --global npm@latest

      - name: Download Node.js distribution
        uses: actions/download-artifact@v8
        with:
          name: node-dist
          path: dist

      - name: Publish to npm
        env:
          # Bootstrap authentication for the first publish. Once npm trusted
          # publishing is configured, npm prefers OIDC and this secret can be removed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./node/package.json').name")
          version=$(node -p "require('./node/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish ./dist/*.tgz --access public
          fi

  github-release:
    name: Create GitHub release
    needs: [publish-python, publish-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: "*-dist"
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
