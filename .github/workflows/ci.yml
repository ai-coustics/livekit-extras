name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
      # Keep uv.lock in step with pyproject.toml. Dependency scanners read the
      # lockfile, so a stale one silently misreports the dependency tree. This
      # runs before `uv sync`, which would otherwise re-lock and mask the drift.
      - run: uv lock --check
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - if: matrix.python-version != '3.10'
        run: uv run mypy
      - run: uv run pytest tests/test_analyzer.py tests/test_processor.py tests/test_vad.py -q

  python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      AIC_INTEGRATION_MODEL_ID: quail-vf-2.2-s-16khz
      AIC_INTEGRATION_VAD_MODEL_ID: vad-2.1-xxs-16khz
      AIC_INTEGRATION_ANALYSIS_MODEL_ID: tyto-1.1-l-16khz
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_SERVER_IMAGE: livekit/livekit-server:v1.13.1
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aic-sdk/models
          key: aic-model-${{ runner.os }}-${{ env.AIC_INTEGRATION_MODEL_ID }}-${{ env.AIC_INTEGRATION_VAD_MODEL_ID }}-${{ env.AIC_INTEGRATION_ANALYSIS_MODEL_ID }}
      - run: uv sync --dev
      - name: Require the SDK license
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: test -n "$AIC_SDK_LICENSE"
      - name: Native Processor, VAD, and Analyzer integration tests
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: uv run pytest tests/test_integration.py -q
      - name: Start LiveKit test server
        run: |
          docker run --detach --name livekit-e2e --network host "$LIVEKIT_SERVER_IMAGE" --dev --logging.level warn
          for attempt in $(seq 1 50); do
            if nc -z 127.0.0.1 7880; then
              exit 0
            fi
            sleep 0.2
          done
          docker logs livekit-e2e
          exit 1
      - name: AgentSession room end-to-end test
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: uv run pytest tests/test_e2e_room.py -q
      - name: LiveKit server logs
        if: ${{ always() }}
        run: docker logs livekit-e2e 2>&1 || true
      - name: Stop LiveKit test server
        if: ${{ always() }}
        run: docker rm --force livekit-e2e 2>/dev/null || true

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  node-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      AIC_INTEGRATION_MODEL_ID: quail-vf-2.2-s-16khz
      AIC_INTEGRATION_ANALYSIS_MODEL_ID: tyto-1.1-l-16khz
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_SERVER_IMAGE: livekit/livekit-server:v1.13.1
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aic-sdk/models
          key: aic-model-${{ runner.os }}-${{ env.AIC_INTEGRATION_MODEL_ID }}-${{ env.AIC_INTEGRATION_ANALYSIS_MODEL_ID }}-node
      - run: npm ci
      - name: Require the SDK license
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: test -n "$AIC_SDK_LICENSE"
      - name: Native Processor integration tests
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: npm run test:integration
      - name: Start LiveKit test server
        run: |
          docker run --detach --name livekit-e2e --network host "$LIVEKIT_SERVER_IMAGE" --dev --logging.level warn
          for attempt in $(seq 1 50); do
            if nc -z 127.0.0.1 7880; then
              exit 0
            fi
            sleep 0.2
          done
          docker logs livekit-e2e
          exit 1
      - name: AgentSession room end-to-end test
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: npm run test:e2e
      - name: LiveKit server logs
        if: ${{ always() }}
        run: docker logs livekit-e2e 2>&1 || true
      - name: Stop LiveKit test server
        if: ${{ always() }}
        run: docker rm --force livekit-e2e 2>/dev/null || true
